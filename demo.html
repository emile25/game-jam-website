<style>
    .clickable-img {
        transition: transform 0.3s ease-in-out;

    }

    .clickable-img.enlarged {
        transform: scale(2); /* Vergroot de afbeelding */
        z-index: 10;
    }
</style>

<script>
    document.querySelectorAll('.clickable-img').forEach(img => {
